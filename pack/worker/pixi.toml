[workspace]
name = "builder-smoke"
version = "0.1.0"
description = "The public Builder smoke Op on the Collab Hub worker seam."
license = "Apache-2.0"
channels = ["conda-forge"]
platforms = ["linux-64"]
requires-pixi = ">=0.82.1"

[dependencies]
python = ">=3.14.10,<3.15"
ca-certificates = ">=2026.10.23"

[tasks]
# The SDK is supplied by the source-pinned Hub image, at PYTHONPATH.
serve = "python serve.py"
